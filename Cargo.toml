[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
alloy = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
