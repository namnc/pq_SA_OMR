[package]
name = "omr-server"
version = "0.1.0"
edition = "2021"

[dependencies]
primitives-omr = { path = "../primitives-omr" }
alloy = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
eyre = "0.6"
clap = { version = "4", features = ["derive"] }
